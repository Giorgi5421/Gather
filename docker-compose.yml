services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gather
      POSTGRES_PASSWORD: gather-local
      POSTGRES_DB: gather
    ports: ["5432:5432"]
    volumes: ["gather-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gather -d gather"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["gather-redis:/data"]
volumes:
  gather-postgres:
  gather-redis:
